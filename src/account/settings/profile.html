<!doctype html>
<html lang="ja">
  <head>
    <title>プロフィール|legal&life</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "プロフィール|legal&life",
        "url": "https://legal-life.pages.dev/account/settings/profile"
      }
    </script>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, maximum-scale=1.0, user-scalable=yes" />
    <meta property="og:title" content="プロフィール|legal&life" />
    <meta property="og:image" content="https://legal-life.pages.dev/assets/images/logo.png" />
    <meta property="og:type" content="website" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/account.css" />
    <meta name="google-site-verification" content="wUVi8GgCi7eXj_gsJcBjjAC8yhbQsEGReAhe_8EBqG8" />
  </head>
<body class="account-page">
<main>
<div class="account-container">
    <a href="/account/settings/" class="back-link">← アカウント設定に戻る</a>
    <h1 class="account-title">プロフィール</h1>
 
    <!-- アバター -->
    <div class="profile-avatar-wrap">
        <div id="profile-avatar">
            <div class="user-info-avatar-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5" width="32" height="32">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>
    </div>
 
    <!-- 情報リスト -->
    <ul class="profile-info-list">
        <li class="profile-info-item">
            <span class="profile-info-label">ユーザー名</span>
            <span class="profile-info-value" id="profile-name-value">読み込み中...</span>
            <div class="profile-info-actions">
                <button id="edit-displayname-btn" class="edit-name-btn">編集</button>
            </div>
        </li>
        <li class="profile-info-item">
            <span class="profile-info-label">メールアドレス</span>
            <span class="profile-info-value" id="profile-email-value">読み込み中...</span>
            <!-- メール確認バッジ: JS で注入 -->
            <div class="profile-info-actions" id="email-verify-action"></div>
        </li>
        <li class="profile-info-item">
            <span class="profile-info-label">UUID</span>
            <span class="profile-info-value" id="profile-uuid-value"
                  style="font-family:monospace;font-size:.82rem;">読み込み中...</span>
            <div class="profile-info-actions">
                <button id="copy-uuid-btn" class="copy-uuid-btn">コピー</button>
            </div>
        </li>
        <li class="profile-info-item">
            <span class="profile-info-label">最終ログイン</span>
            <span class="profile-info-value" id="profile-lastlogin-value">読み込み中...</span>
        </li>
    </ul>
 
    <!-- ★ メール確認バナー: 常に DOM に存在させ JS で表示制御 -->
    <div id="email-verify-banner" class="banner banner-warn" style="display:none;">
        <p class="banner-title" style="display:flex;align-items:center;gap:6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
            メールアドレスが未確認です
        </p>
        <p style="font-size:.83rem;margin-bottom:10px;">
            一部のセキュリティ機能はメール確認後に利用できます。
        </p>
        <button id="send-verify-email-btn" class="btn-primary"
                style="padding:9px;font-size:.85rem;">
            確認メールを再送する
        </button>
        <p id="verify-email-msg" class="settings-msg"></p>
    </div>
 
    <div class="section-divider">危険な操作</div>
    <a href="/account/delete"
       style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;
              padding:11px;background:var(--danger);color:#fff;border-radius:var(--radius);
              font-weight:700;font-size:.93rem;">
        アカウントを削除する
    </a>
 
    <div class="link-group" style="margin-top:18px;">
        <a href="/account/settings/" class="link-item">アカウント設定に戻る</a>
    </div>
</div>
</main>
<script type="module" src="/assets/js/important.js"></script>
<script type="module" src="/assets/js/account.js"></script>
    <script src="/assets/js/access-log.js"></script>
  </body>
</html>
